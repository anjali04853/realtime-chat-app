services:
  - type: web
    name: realtime-chat-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      # Set this in the Render dashboard (e.g. a free MongoDB Atlas cluster).
      # Render's filesystem is ephemeral, so without it history resets on redeploy.
      - key: MONGODB_URI
        sync: false
